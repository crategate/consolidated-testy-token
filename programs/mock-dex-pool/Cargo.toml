[package]
name = "mock-dex-pool"
version = "0.1.0"
description = "STUB fixed-rate AFHO dispenser for localnet/devnet buyback tests."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_dex_pool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1" }
anchor-spl = { version = "0.31.1", features = ["token_2022"] }